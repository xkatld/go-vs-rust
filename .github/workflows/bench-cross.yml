name: "Bench 3: Cross-compile Linux binaries (amd64 + arm64)"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: go-10m
            lang: go
          - target: go-30m
            lang: go
          - target: rust-10m
            lang: rust-lto
          - target: rust-30m
            lang: rust-lto
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchains
        run: |
          sudo apt-get update -qq
          if [[ "${{ matrix.lang }}" == go* ]]; then
            go version
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
            rustup target add aarch64-unknown-linux-gnu
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          fi

      - name: Run benchmark
        run: |
          chmod +x scripts/run_bench.sh
          MB=$( [[ "${{ matrix.target }}" == *10m* ]] && echo 10 || echo 30 )
          scripts/run_bench.sh "${{ matrix.lang }}" "cross-${MB}m" "${{ matrix.arch }}" 4 \
            "projects/${{ matrix.target }}" "result.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-cross-${{ matrix.target }}-${{ matrix.arch }}
          path: result.json
