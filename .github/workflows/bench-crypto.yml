name: "Bench 2: Crypto components"

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lang: [go, rust-lto]
        cores: [1, 2, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: startsWith(matrix.lang, 'rust')
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run benchmark
        run: |
          chmod +x scripts/run_bench.sh
          scripts/run_bench.sh "${{ matrix.lang }}" crypto amd64 "${{ matrix.cores }}" \
            "crypto/${{ matrix.lang == 'go' && 'go-crypto' || 'rust-crypto' }}" "result.json"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result-crypto-${{ matrix.lang }}-${{ matrix.cores }}
          path: result.json
