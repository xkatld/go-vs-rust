[package]
name = "rustcrypto-bench"
version = "1.0.0"
edition = "2021"

[dependencies]
ring = "0.17"
sha2 = "0.10"
sha1 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
pbkdf2 = "0.12"
scrypt = "0.11"
hmac = "0.12"
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
